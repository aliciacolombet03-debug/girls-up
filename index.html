<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Girl's Up!</title>
<style>
  :root {
    --blue: #5ab4e0;
    --blue-dark: #2e8cba;
    --blue-light: #d6f0fb;
    --purple: #c05aa0;
    --purple-dark: #8e3a76;
    --purple-light: #f5d6ee;
    --yellow: #f5d800;
    --yellow-dark: #c9a800;
    --bg: #f0f6fc;
    --card-bg: #fff;
    --text: #1a1a2e;
    --text-muted: #5a6a7a;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 4px 20px rgba(90,180,224,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 1.25rem 1rem 2rem;
    min-height: 100vh;
  }

  /* ── Logo ── */
  .logo-wrap {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .logo-svg { width: 140px; height: auto; }

  /* ── Screens ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── Cards ── */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
  }

  /* ── Typography ── */
  .page-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--purple-dark);
    text-align: center;
    margin-bottom: 4px;
  }
  .page-sub {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 1.25rem;
  }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--blue-dark);
    margin-bottom: 8px;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 22px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: transform 0.1s, filter 0.15s;
    letter-spacing: 0.2px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--purple) 0%, var(--blue-dark) 100%);
    color: #fff;
    box-shadow: 0 3px 12px rgba(192,90,160,0.35);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-success {
    background: #2e9e6e; color: #fff;
    box-shadow: 0 3px 10px rgba(46,158,110,0.3);
  }
  .btn-danger {
    background: #f0f4f8; color: #c0392b;
    border: 1.5px solid #e0c0c0;
  }
  .btn-ghost {
    background: transparent; color: var(--text-muted);
    border: 1.5px solid #d0dae5;
  }
  .btn-ghost:hover { background: #f0f4f8; }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn-full { width: 100%; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  /* ── Team input rows ── */
  .team-row {
    display: flex; gap: 8px; margin-bottom: 8px; align-items: center;
  }
  .team-color-dot {
    width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0;
  }
  .team-row input {
    flex: 1;
    padding: 9px 12px;
    border: 1.5px solid #d5e5f0;
    border-radius: var(--radius-sm);
    font-size: 14px;
    color: var(--text);
    background: #f7fbfe;
    outline: none;
    transition: border-color 0.15s;
  }
  .team-row input:focus { border-color: var(--blue); }
  .btn-remove {
    background: none; border: 1.5px solid #e0daf0; border-radius: 8px;
    color: var(--text-muted); cursor: pointer; padding: 6px 10px; font-size: 14px;
  }
  .btn-remove:hover { background: #fdf0f9; color: var(--purple); border-color: var(--purple-light); }

  /* ── Timer slider ── */
  .slider-row {
    display: flex; align-items: center; gap: 12px; margin-top: 4px;
  }
  .slider-row input[type=range] {
    flex: 1; accent-color: var(--purple);
  }
  .slider-val {
    font-size: 14px; font-weight: 700; color: var(--purple-dark);
    min-width: 40px; text-align: right;
  }

  /* ── Scoreboard ── */
  .scoreboard { display: flex; flex-direction: column; gap: 8px; }
  .score-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: #f7fbfe;
    border-radius: var(--radius-sm);
    border: 1.5px solid #d5e5f0;
    transition: border-color 0.2s, background 0.2s;
  }
  .score-row.active {
    background: var(--purple-light);
    border-color: var(--purple);
  }
  .score-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .score-name { flex: 1; font-size: 14px; font-weight: 600; }
  .score-pts {
    font-size: 18px; font-weight: 700; color: var(--purple-dark);
  }

  /* ── Round pill ── */
  .round-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--purple-light), var(--blue-light));
    border: 1.5px solid var(--purple);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--purple-dark);
    margin-bottom: 0.75rem;
  }

  /* ── Playing card ── */
  .big-card {
    background: linear-gradient(160deg, #fff 60%, var(--blue-light) 100%);
    border-radius: var(--radius);
    box-shadow: 0 6px 30px rgba(90,90,200,0.13);
    border: 2px solid var(--blue);
    padding: 2rem 1.5rem;
    text-align: center;
    margin: 0.75rem 0;
    min-height: 130px;
    display: flex; align-items: center; justify-content: center;
  }
  .big-word {
    font-size: 30px;
    font-weight: 800;
    color: var(--purple-dark);
    line-height: 1.2;
    letter-spacing: -0.5px;
  }

  /* ── Timer ── */
  .timer-ring {
    text-align: center;
    margin: 0.5rem 0;
  }
  .timer-ring svg { overflow: visible; }
  .timer-num {
    font-size: 44px;
    font-weight: 800;
    line-height: 1;
    transition: color 0.3s;
  }
  .timer-num.ok { color: var(--blue-dark); }
  .timer-num.warn { color: #e67e22; }
  .timer-num.danger { color: #c0392b; }

  /* ── Cards left badge ── */
  .cards-left-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: #f0f4f8; border-radius: 999px;
    padding: 4px 12px; font-size: 12px; color: var(--text-muted); font-weight: 600;
  }

  /* ── Action row ── */
  .action-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0.75rem 0;
  }

  /* ── Turn result ── */
  .big-score {
    text-align: center;
    font-size: 56px; font-weight: 800; color: var(--blue-dark);
    line-height: 1; margin: 0.5rem 0;
  }

  /* ── Winner ── */
  .winner-wrap { text-align: center; padding: 1.5rem 0; }
  .winner-trophy { font-size: 56px; margin-bottom: 0.5rem; }
  .winner-name { font-size: 26px; font-weight: 800; color: var(--purple-dark); }
  .winner-pts { font-size: 16px; color: var(--text-muted); margin-top: 4px; }

  /* ── Swirly background strip ── */
  .swirl-strip {
    width: 100%; height: 8px;
    background: linear-gradient(90deg, var(--purple) 0%, var(--blue) 50%, var(--purple) 100%);
    border-radius: 4px;
    margin-bottom: 1.25rem;
  }

  /* ── Divider ── */
  .divider { height: 1px; background: #e8eef5; margin: 1rem 0; }

  /* ── Round intro emoji big ── */
  .round-emoji { font-size: 52px; text-align: center; margin: 0.5rem 0 1rem; }
</style>
</head>
<body>
<div id="app">

<!-- SETUP -->
<div id="screen-setup" class="screen active">
  <div class="logo-wrap">
    <svg class="logo-svg" viewBox="0 0 280 90" xmlns="http://www.w3.org/2000/svg">
      <!-- Swirl background pill -->
      <rect x="0" y="0" width="280" height="90" rx="18" fill="#5ab4e0"/>
      <ellipse cx="200" cy="45" rx="100" ry="60" fill="#c05aa0" opacity="0.55"/>
      <!-- GIRL'S UP! text -->
      <text x="140" y="36" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#f5d800" stroke="#8e3a76" stroke-width="1.5" paint-order="stroke">GIRL'S</text>
      <text x="140" y="68" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#fff" stroke="#2e8cba" stroke-width="1.5" paint-order="stroke">UP! 🎉</text>
      <!-- Stars deco -->
      <text x="18" y="28" font-size="14" fill="#f5d800">★</text>
      <text x="250" y="28" font-size="14" fill="#f5d800">★</text>
      <text x="8" y="62" font-size="10" fill="#fff" opacity="0.8">✦</text>
      <text x="262" y="62" font-size="10" fill="#fff" opacity="0.8">✦</text>
    </svg>
  </div>
  <div class="swirl-strip"></div>

  <div class="card">
    <div class="section-label">Équipes</div>
    <div id="teams-list">
      <div class="team-row">
        <div class="team-color-dot" style="background:#c05aa0"></div>
        <input type="text" value="Équipe 1">
        <button class="btn-remove" onclick="removeTeam(this)">✕</button>
      </div>
      <div class="team-row">
        <div class="team-color-dot" style="background:#5ab4e0"></div>
        <input type="text" value="Équipe 2">
        <button class="btn-remove" onclick="removeTeam(this)">✕</button>
      </div>
    </div>
    <button class="btn btn-ghost btn-sm btn-full" onclick="addTeam()" style="margin-top:10px">
      + Ajouter une équipe
    </button>
  </div>

  <div class="card">
    <div class="section-label">Durée du tour</div>
    <div class="slider-row">
      <span style="font-size:13px;color:var(--text-muted)">20s</span>
      <input type="range" min="20" max="120" step="5" value="30" id="timer-slider"
        oninput="document.getElementById('timer-val').textContent=this.value+'s'">
      <span style="font-size:13px;color:var(--text-muted)">2min</span>
      <span class="slider-val" id="timer-val">30s</span>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Cartes par partie</div>
    <div class="slider-row">
      <span style="font-size:13px;color:var(--text-muted)">10</span>
      <input type="range" min="10" max="60" step="5" value="30" id="cards-slider"
        oninput="document.getElementById('cards-val').textContent=this.value+' cartes'">
      <span style="font-size:13px;color:var(--text-muted)">60</span>
      <span class="slider-val" id="cards-val">30 cartes</span>
    </div>
    <div style="font-size:12px;color:var(--text-muted);margin-top:6px">
      Ces cartes seront réutilisées sur les 3 manches — chaque partie est unique 🎲
    </div>
  </div>

  <button class="btn btn-primary btn-full" onclick="startGame()" style="margin-top:0.5rem;font-size:16px;padding:14px">
    ▶ Commencer la partie
  </button>
</div>

<!-- ROUND INTRO -->
<div id="screen-round-intro" class="screen">
  <div class="logo-wrap" style="margin-bottom:0.75rem">
    <svg class="logo-svg" viewBox="0 0 280 90" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="280" height="90" rx="18" fill="#5ab4e0"/>
      <ellipse cx="200" cy="45" rx="100" ry="60" fill="#c05aa0" opacity="0.55"/>
      <text x="140" y="36" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#f5d800" stroke="#8e3a76" stroke-width="1.5" paint-order="stroke">GIRL'S</text>
      <text x="140" y="68" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#fff" stroke="#2e8cba" stroke-width="1.5" paint-order="stroke">UP! 🎉</text>
      <text x="18" y="28" font-size="14" fill="#f5d800">★</text>
      <text x="250" y="28" font-size="14" fill="#f5d800">★</text>
    </svg>
  </div>
  <div class="swirl-strip"></div>
  <div class="round-emoji" id="round-intro-emoji"></div>
  <div class="page-title" id="round-intro-title"></div>
  <div class="page-sub" id="round-intro-desc"></div>
  <div class="card" style="margin:1rem 0">
    <div class="section-label">Scores</div>
    <div id="round-intro-scoreboard" class="scoreboard"></div>
  </div>
  <button class="btn btn-primary btn-full" onclick="startRound()" style="font-size:15px;padding:13px">
    ▶ Lancer la manche
  </button>
</div>

<!-- TURN START -->
<div id="screen-turn-start" class="screen">
  <div class="logo-wrap" style="margin-bottom:0.75rem">
    <svg class="logo-svg" viewBox="0 0 280 90" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="280" height="90" rx="18" fill="#5ab4e0"/>
      <ellipse cx="200" cy="45" rx="100" ry="60" fill="#c05aa0" opacity="0.55"/>
      <text x="140" y="36" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#f5d800" stroke="#8e3a76" stroke-width="1.5" paint-order="stroke">GIRL'S</text>
      <text x="140" y="68" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#fff" stroke="#2e8cba" stroke-width="1.5" paint-order="stroke">UP! 🎉</text>
      <text x="18" y="28" font-size="14" fill="#f5d800">★</text>
      <text x="250" y="28" font-size="14" fill="#f5d800">★</text>
    </svg>
  </div>
  <div class="swirl-strip"></div>
  <div style="text-align:center;margin-bottom:1rem">
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">C'est au tour de</div>
    <div id="turn-team-name" style="font-size:26px;font-weight:800;color:var(--purple-dark)"></div>
    <div id="turn-round-label" class="round-pill" style="margin:10px auto 0;display:inline-flex"></div>
  </div>
  <div class="card">
    <div class="section-label">Scores</div>
    <div id="turn-scoreboard" class="scoreboard"></div>
  </div>
  <button class="btn btn-primary btn-full" onclick="beginTurn()" style="font-size:15px;padding:13px">
    ▶ C'est parti !
  </button>
</div>

<!-- PLAYING -->
<div id="screen-playing" class="screen">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem">
    <div class="round-pill" id="playing-round-pill" style="margin-bottom:0"></div>
    <div class="cards-left-badge">🃏 <span id="playing-cards-left">0</span></div>
  </div>

  <div class="timer-ring">
    <div class="timer-num ok" id="timer-text">30</div>
  </div>

  <div class="big-card">
    <div class="big-word" id="current-word">…</div>
  </div>

  <div class="action-row">
    <button class="btn btn-success" onclick="cardCorrect()" style="font-size:15px;padding:13px">
      ✓ Bonne réponse
    </button>
    <button class="btn btn-danger" onclick="cardSkip()" style="font-size:15px;padding:13px">
      → Passer
    </button>
  </div>
  <button class="btn btn-ghost btn-full btn-sm" onclick="endTurnEarly()" style="margin-top:4px">
    ⏹ Arrêter le tour
  </button>
</div>

<!-- TURN END -->
<div id="screen-turn-end" class="screen">
  <div class="logo-wrap" style="margin-bottom:0.5rem">
    <svg class="logo-svg" viewBox="0 0 280 90" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="280" height="90" rx="18" fill="#5ab4e0"/>
      <ellipse cx="200" cy="45" rx="100" ry="60" fill="#c05aa0" opacity="0.55"/>
      <text x="140" y="36" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#f5d800" stroke="#8e3a76" stroke-width="1.5" paint-order="stroke">GIRL'S</text>
      <text x="140" y="68" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#fff" stroke="#2e8cba" stroke-width="1.5" paint-order="stroke">UP! 🎉</text>
      <text x="18" y="28" font-size="14" fill="#f5d800">★</text>
      <text x="250" y="28" font-size="14" fill="#f5d800">★</text>
    </svg>
  </div>
  <div class="swirl-strip"></div>
  <div style="text-align:center;margin-bottom:0.75rem">
    <div style="font-size:22px;font-weight:700;color:var(--purple-dark)">⏱ Temps écoulé !</div>
    <div id="turn-end-team" style="font-size:15px;color:var(--text-muted);margin-top:4px"></div>
  </div>
  <div class="card" style="text-align:center">
    <div class="section-label">Cartes réussies ce tour</div>
    <div class="big-score" id="turn-end-score">0</div>
  </div>
  <div class="card">
    <div class="section-label">Scores</div>
    <div id="turn-end-scoreboard" class="scoreboard"></div>
  </div>
  <button class="btn btn-primary btn-full" onclick="nextTurn()" id="next-turn-btn" style="font-size:15px;padding:13px">
    Tour suivant ▶
  </button>
</div>

<!-- FINAL -->
<div id="screen-final" class="screen">
  <div class="logo-wrap" style="margin-bottom:0.5rem">
    <svg class="logo-svg" viewBox="0 0 280 90" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="280" height="90" rx="18" fill="#5ab4e0"/>
      <ellipse cx="200" cy="45" rx="100" ry="60" fill="#c05aa0" opacity="0.55"/>
      <text x="140" y="36" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#f5d800" stroke="#8e3a76" stroke-width="1.5" paint-order="stroke">GIRL'S</text>
      <text x="140" y="68" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#fff" stroke="#2e8cba" stroke-width="1.5" paint-order="stroke">UP! 🎉</text>
      <text x="18" y="28" font-size="14" fill="#f5d800">★</text>
      <text x="250" y="28" font-size="14" fill="#f5d800">★</text>
    </svg>
  </div>
  <div class="swirl-strip"></div>
  <div class="winner-wrap">
    <div class="winner-trophy">🏆</div>
    <div class="winner-name" id="final-winner"></div>
    <div class="winner-pts" id="final-winner-score"></div>
  </div>
  <div class="card">
    <div class="section-label">Classement final</div>
    <div id="final-scoreboard" class="scoreboard"></div>
  </div>
  <button class="btn btn-primary btn-full" onclick="resetGame()" style="font-size:15px;padding:13px;margin-top:0.5rem">
    🔄 Rejouer
  </button>
</div>

</div>

<script>

  "Claude","Euphoria","Red Flag","Airbnb","Matcha Latte","Burrata","Uber","Pilates",
  "Crocs","Pinterest","Apéro","Graille","Undercover","Café","Corse","Time's Up",
  "Skyrock","Un remis","Winx","Stalker son ex","Se faire blanchir l'anus","Totally Spies",
  "AirPods","Wejdene","Canva","ChatGPT","Vlog","Illustrator","Eau","Fumée","Vapeur","Chimie",
  "Physique","Chargée en bas","Enzo Plaza","Mauvais perdant","Affligeant","Chier",
  "Avoir la main verte","Noir ou blanc","Horloge","Graisse de canard","Désapplaudir","Vinaigrette",
  "Willow","Bagues de doigts de pied","Amsterdam"
];

const ROUNDS = [
  { name: "Manche 1", label: "Décris le mot", desc: "Décris le mot sans le dire, ni faire de gestes !", emoji: "💬" },
  { name: "Manche 2", label: "Un seul mot", desc: "Un seul mot pour faire deviner — ni plus, ni moins !", emoji: "☝️" },
  { name: "Manche 3", label: "Mime", desc: "Mime uniquement — zéro son autorisé !", emoji: "🙌" },
];

let state = {};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function addTeam() {
  const list = document.getElementById('teams-list');
  const n = list.children.length;
  const color = TEAM_COLORS[n % TEAM_COLORS.length];
  const row = document.createElement('div');
  row.className = 'team-row';
  row.innerHTML = `<div class="team-color-dot" style="background:${color}"></div><input type="text" value="Équipe ${n+1}"><button class="btn-remove" onclick="removeTeam(this)">✕</button>`;
  list.appendChild(row);
}

function removeTeam(btn) {
  const list = document.getElementById('teams-list');
  if (list.children.length > 2) btn.parentElement.remove();
}

function getTeamNames() {
  return Array.from(document.querySelectorAll('#teams-list input')).map(i => i.value.trim() || i.placeholder);
}

function startGame() {
  const names = getTeamNames();
  const timerSecs = parseInt(document.getElementById('timer-slider').value);
  const cardCount = parseInt(document.getElementById('cards-slider').value);
  const pickedCards = shuffle(ALL_CARDS).slice(0, cardCount);
  state = {
    teams: names.map((n,i) => ({ name: n, score: 0, color: TEAM_COLORS[i % TEAM_COLORS.length] })),
    timerDuration: timerSecs,
    gameCards: pickedCards,
    currentRound: 0,
    currentTeamIdx: 0,
    roundDeck: shuffle(pickedCards),
    turnScore: 0,
    timer: null,
    timeLeft: timerSecs,
    playing: false,
  };
  showRoundIntro();
}

function showRoundIntro() {
  const r = ROUNDS[state.currentRound];
  document.getElementById('round-intro-emoji').textContent = r.emoji;
  document.getElementById('round-intro-title').textContent = r.name + ' — ' + r.label;
  document.getElementById('round-intro-desc').textContent = r.desc;
  renderScoreboard('round-intro-scoreboard', -1);
  if (state.currentRound > 0) state.roundDeck = shuffle(state.gameCards);
  show('screen-round-intro');
}

function startRound() { showTurnStart(); }

function showTurnStart() {
  const team = state.teams[state.currentTeamIdx];
  const r = ROUNDS[state.currentRound];
  document.getElementById('turn-team-name').textContent = '🎤 ' + team.name;
  document.getElementById('turn-round-label').textContent = r.emoji + ' ' + r.label + '  ·  ' + state.roundDeck.length + ' cartes';
  renderScoreboard('turn-scoreboard', state.currentTeamIdx);
  show('screen-turn-start');
}

function beginTurn() {
  state.turnScore = 0;
  state.timeLeft = state.timerDuration;
  const r = ROUNDS[state.currentRound];
  document.getElementById('playing-round-pill').textContent = r.emoji + ' ' + r.label;
  updateTimerDisplay();
  nextCard();
  show('screen-playing');
  startTimer();
}

function nextCard() {
  if (state.roundDeck.length === 0) { endRound(); return; }
  document.getElementById('current-word').textContent = state.roundDeck[0];
  document.getElementById('playing-cards-left').textContent = state.roundDeck.length;
}

function cardCorrect() {
  if (!state.playing) return;
  state.turnScore++;
  state.teams[state.currentTeamIdx].score++;
  state.roundDeck.shift();
  if (state.roundDeck.length === 0) { clearInterval(state.timer); state.playing = false; endRound(); return; }
  nextCard();
}

function cardSkip() {
  if (!state.playing) return;
  const s = state.roundDeck.shift();
  state.roundDeck.push(s);
  nextCard();
}

function startTimer() {
  state.playing = true;
  state.timer = setInterval(() => {
    state.timeLeft--;
    updateTimerDisplay();
    if (state.timeLeft <= 0) {
      clearInterval(state.timer);
      state.playing = false;
      endTurn();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('timer-text');
  if (!el) return;
  el.textContent = state.timeLeft;
  el.className = 'timer-num ' + (state.timeLeft <= 5 ? 'danger' : state.timeLeft <= 10 ? 'warn' : 'ok');
}

function endTurnEarly() {
  clearInterval(state.timer);
  state.playing = false;
  endTurn();
}

function endTurn() {
  document.getElementById('turn-end-team').textContent = state.teams[state.currentTeamIdx].name;
  document.getElementById('turn-end-score').textContent = state.turnScore;
  renderScoreboard('turn-end-scoreboard', -1);
  const btn = document.getElementById('next-turn-btn');
  btn.textContent = state.roundDeck.length === 0 ? 'Fin de manche ▶' : 'Tour suivant ▶';
  show('screen-turn-end');
}

function nextTurn() {
  if (state.roundDeck.length === 0) { endRound(); return; }
  state.currentTeamIdx = (state.currentTeamIdx + 1) % state.teams.length;
  showTurnStart();
}

function endRound() {
  state.currentRound++;
  if (state.currentRound >= ROUNDS.length) { showFinal(); return; }
  state.currentTeamIdx = (state.currentTeamIdx + 1) % state.teams.length;
  showRoundIntro();
}

function showFinal() {
  const sorted = [...state.teams].sort((a,b) => b.score - a.score);
  document.getElementById('final-winner').textContent = sorted[0].name;
  document.getElementById('final-winner-score').textContent = sorted[0].score + ' points au total';
  const medals = ['🥇','🥈','🥉'];
  const sb = document.getElementById('final-scoreboard');
  sb.innerHTML = '';
  sorted.forEach((t,i) => {
    const el = document.createElement('div');
    el.className = 'score-row';
    el.innerHTML = `<div class="score-dot" style="background:${t.color}"></div><span class="score-name">${medals[i]||''} ${t.name}</span><span class="score-pts">${t.score} pts</span>`;
    sb.appendChild(el);
  });
  show('screen-final');
}

function renderScoreboard(id, activeIdx) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '';
  state.teams.forEach((t,i) => {
    const div = document.createElement('div');
    div.className = 'score-row' + (i === activeIdx ? ' active' : '');
    div.innerHTML = `<div class="score-dot" style="background:${t.color}"></div><span class="score-name">${t.name}</span><span class="score-pts">${t.score} pts</span>`;
    el.appendChild(div);
  });
}

function resetGame() { show('screen-setup'); }
</script>
</body>
</html>
